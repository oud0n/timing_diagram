[package]
name = "timing_diagram"
version = "1.0.0"
description = "Timing diagram editor"
authors = ["Timing Diagram contributors"]
edition = "2021"

[lib]
name = "timing_diagram_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
