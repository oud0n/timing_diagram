name: Build Desktop Packages
on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: timing_diagram-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      # Installers only: the .app bundle is a directory and cannot be a release asset.
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    name: Release to GitHub
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: release-*
          merge-multiple: true
      - run: ls -la release-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          # Tags with a hyphen such as v1.2.3-rc.1 are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            - macOS: `Timing Diagram_*_aarch64.dmg`（Apple Silicon 専用）。Developer ID 署名・公証をしていないため、「壊れているため開けません」と表示された場合は [README の手順](https://github.com/oud0n/timing_diagram#macos-で壊れているため開けませんと表示される場合) で `xattr -cr` を実行してください。
            - Windows: `*_x64-setup.exe`（NSIS）または `*_x64_en-US.msi`。動作確認は macOS のみで、Windows はビルド成功のみ確認しています。
            - ブラウザ版: https://oud0n.github.io/timing_diagram/
