name: Build Desktop Packages
on:
  workflow_dispatch:
    inputs:
      notarize:
        description: 'Mac 版を公証する (タグでは自動で公証する)'
        type: boolean
        default: false
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build desktop package (Windows)
        if: runner.os == 'Windows'
        run: npm run desktop:build

      # Mac 版: Secrets に Developer ID の証明書があれば署名し、タグ (または手動で notarize を選んだとき) は公証もする。
      # Secrets がないとき (フォークなど) は、これまでどおり ad-hoc 署名 (tauri.conf.json の signingIdentity "-") で作る
      - name: Build desktop package (macOS)
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID_VALUE: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_VALUE: ${{ secrets.APPLE_API_ISSUER }}
          NOTARIZE: ${{ startsWith(github.ref, 'refs/tags/') || inputs.notarize == true }}
        run: |
          # 途中で失敗しても、鍵の入ったファイルを残さない
          trap 'rm -f "$RUNNER_TEMP/pem.pem" "$RUNNER_TEMP/in.p12" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"' EXIT
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            # キーチェーンアクセスが書き出した .p12 は古い暗号 (RC2) で、CI の OpenSSL 3 は -legacy でないと読めない。
            # どの macOS の security でも読める形 (3DES・SHA1) に入れ直してから使う
            printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/in.p12"
            openssl pkcs12 -legacy -in "$RUNNER_TEMP/in.p12" -nodes -passin env:MAC_CERT_PASSWORD -out "$RUNNER_TEMP/pem.pem"
            openssl pkcs12 -export -in "$RUNNER_TEMP/pem.pem" -out "$RUNNER_TEMP/cert.p12" -passout env:MAC_CERT_PASSWORD \
              -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
            echo "keys in p12: $(grep -c "PRIVATE KEY-----" "$RUNNER_TEMP/pem.pem" || true), certs: $(grep -c "BEGIN CERTIFICATE" "$RUNNER_TEMP/pem.pem" || true)"
            rm -f "$RUNNER_TEMP/pem.pem" "$RUNNER_TEMP/in.p12"
            # 署名用のキーチェーンを自分で作り、検索リストに足す (Tauri の APPLE_CERTIFICATE は使わない)
            KC="$RUNNER_TEMP/signing.keychain-db"
            KC_PW="$(openssl rand -hex 16)"
            security create-keychain -p "$KC_PW" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$KC_PW" "$KC"
            security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" > /dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            rm -f "$RUNNER_TEMP/cert.p12"
            # 環境変数の APPLE_SIGNING_IDENTITY は tauri.conf.json の signingIdentity より優先される
            export APPLE_SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
            if [ -z "$APPLE_SIGNING_IDENTITY" ]; then echo "::error::証明書の中に Developer ID Application の ID がありません"; exit 1; fi
            echo "Developer ID で署名します"
          else
            # タグ (リリース) で証明書が無いときは止める (署名なしのものをリリースに上げない)
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "::error::リリースのタグなのに、署名の証明書 (MAC_CERT_P12_BASE64) がありません"; exit 1; fi
            echo "証明書がないので、ad-hoc 署名で作ります"
          fi
          if [ "$NOTARIZE" = "true" ] && [ -n "$APPLE_API_KEY_P8" ] && [ -n "$MAC_CERT_P12_BASE64" ]; then
            # Tauri では APPLE_API_KEY が鍵の ID、APPLE_API_KEY_PATH が .p8 のパス (electron-builder と違う)
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY="$APPLE_API_KEY_ID_VALUE"
            export APPLE_API_ISSUER="$APPLE_API_ISSUER_VALUE"
            echo "公証します"
          fi
          npm run desktop:build

      # タグ (リリース) のときは、署名か公証が通っていなければ止める (署名なし・公証なしのものをリリースに上げない)
      - name: Check macOS signature
        if: runner.os == 'macOS'
        env:
          HAS_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
        run: |
          APP=$(ls -d src-tauri/target/release/bundle/macos/*.app)
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier|Signature=' || true
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "$HAS_CERT" = "true" ]; then
            codesign --verify --deep --strict "$APP"
            spctl -a -vv -t exec "$APP"
            xcrun stapler validate "$APP"
          else
            spctl -a -vv -t exec "$APP" 2>&1 || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tickwave-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      # Installers only: the .app bundle is a directory and cannot be a release asset.
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    name: Release to GitHub
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: release-*
          merge-multiple: true
      - run: ls -la release-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          # Artifacts keep the bundle subfolders (dmg/, msi/, nsis/).
          files: release-artifacts/**/*
          fail_on_unmatched_files: true
          draft: false
          # Tags with a hyphen such as v1.2.3-rc.1 are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            - macOS: `Tickwave_*_aarch64.dmg`（Apple Silicon 専用）。Developer ID で署名し、Apple の公証を通しています。
            - Windows: `*_x64-setup.exe`（NSIS）または `*_x64_en-US.msi`。動作確認は macOS のみで、Windows はビルド成功のみ確認しています。
            - ブラウザ版: https://oud0n.github.io/timing_diagram/
